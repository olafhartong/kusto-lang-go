name: Kusto upstream check

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Verify local Kusto provenance and parity attestations
        run: go run ./cmd/kusto-upstream-check -verify-provenance -local-only

      - name: Check pinned Kusto revision and source snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/kusto-upstream-check -upstream-file third_party/kusto/UPSTREAM.json -verify-source-files
